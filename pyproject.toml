[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Hamza Malik", email = "hamzamalik123450@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "weaviate-client>=4.23.1",
]

[project.scripts]
